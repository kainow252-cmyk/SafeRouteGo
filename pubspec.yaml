name: saferoutego
description: SafeRouteGo - Seguro Automóvel por Percurso (pay-per-km) · saferoutego.com.br
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: 6.2.1
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  flutter_svg: 2.0.10+1
  flutter_map: 8.3.0
  latlong2: 0.9.1
  geolocator: 13.0.4
  http: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
    - assets/data/
