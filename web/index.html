<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SafeRouteGo — Seguro automóvel inteligente por percurso. Pague apenas pelo que você usa. saferoutego.com.br">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SafeRouteGo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SafeRouteGo</title>
  <link rel="manifest" href="manifest.json">
  <!-- Permissão de geolocalização para GPS em tempo real -->
  <meta http-equiv="Permissions-Policy" content="geolocation=*">
</head>
<body>
  <!-- ── Detecção de rota /admin ANTES do Flutter carregar ────────── -->
  <script>
    (function() {
      try {
        var path = window.location.pathname || '';
        var hash = window.location.hash || '';
        var isAdmin = path.indexOf('/admin') !== -1 || hash.indexOf('/admin') !== -1;
        if (isAdmin) {
          sessionStorage.setItem('saferoutego_start_route', 'admin');
          localStorage.setItem('saferoutego_start_route', 'admin');
          window.__SAFEROUTE_ADMIN__ = true;
        }
      } catch(e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
